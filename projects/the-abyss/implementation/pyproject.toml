[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss-empirical-research-preview"
version = "0.1.0.dev0"
description = "The Abyss: traceable memory and controlled empirical AI experiments"
readme = "README.en.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.4"]
experiments = ["torch==2.9.1", "numpy==2.1.3", "psutil==5.9.0"]

[tool.setuptools.packages.find]
where = ["project"]
include = ["empirical_core*"]

[tool.pytest.ini_options]
testpaths = ["project/tests"]
pythonpath = ["project", "project/tests"]
markers = [
  "integration: subprocess, platform, or cross-directory integration checks",
  "training: checks that perform optimizer updates",
  "slow: checks with potentially nontrivial compute or memory use",
]
